<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  body{width:300px;margin:0;padding:16px;font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#2b2b33;background:#fbfaff}
  h1{font-size:14px;margin:0 0 2px;display:flex;align-items:center;gap:8px}
  h1 .dot{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#6C4CF0,#9B6CFF);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .sub{font-size:11px;color:#8a8a95;margin:0 0 12px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 2px;border-top:1px solid #eeecf8}
  .row:first-of-type{border-top:none}
  label{cursor:pointer}
  input[type=checkbox]{accent-color:#6C4CF0;width:15px;height:15px;cursor:pointer}
  .btn{display:block;width:100%;margin-top:12px;padding:9px 0;border:none;border-radius:10px;background:#6C4CF0;color:#fff;font-weight:600;font-size:13px;cursor:pointer}
  .btn:hover{background:#5b3fd6}
  .note{margin-top:10px;font-size:10.5px;color:#a0a0aa;line-height:1.5}
</style>
</head>
<body>
  <h1><span class="dot">EN</span>Alice AI — English Overlay</h1>
  <p class="sub">v1.0.0 · alice.yandex.ru · free anonymous access</p>

  <div class="row"><label for="t-enReplies">Reply in English (auto)</label><input type="checkbox" id="t-enReplies"></div>
  <div class="row"><label for="t-translateBtn">"EN" translate button on replies</label><input type="checkbox" id="t-translateBtn"></div>
  <div class="row"><label for="t-chips">English prompt chips</label><input type="checkbox" id="t-chips"></div>
  <div class="row"><label for="t-hideUpsell">Hide ads &amp; login upsells</label><input type="checkbox" id="t-hideUpsell"></div>
  <div class="row"><label for="t-carryContext">Carry context to new chats</label><input type="checkbox" id="t-carryContext"></div>
  <div class="row"><label for="t-modeBar">Show mode bar</label><input type="checkbox" id="t-modeBar"></div>

  <button class="btn" id="open">Open Alice in English</button>

  <p class="note">Uses Yandex's official free anonymous mode. Free-tier limits (standard model at busy hours) are set by Yandex and can't be bypassed — log in free for the full model.</p>

  <script src="popup.js"></script>
</body>
</html>
